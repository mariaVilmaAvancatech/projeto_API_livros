<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual - Pedagogia & Psicologia</title>
    <!-- Fonte Google Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Folha de Estilos Externa -->
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

    <!-- Cabeçalho Principal -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <span class="brand-icon">📚</span>
                <span class="brand-name">EduMind</span>
            </div>
            
            <div class="controls">
                <!-- Botão de Alternar Idioma -->
                <button id="lang-toggle" class="btn-control" aria-label="Alternar Idioma" onclick="toggleLanguage()">
                    🌐 <span id="lang-label">PT</span>
                </button>
                
                <!-- Botão de Alternar Tema (Modo Escuro / Claro) -->
                <button id="theme-toggle" class="btn-control" aria-label="Alternar Tema" onclick="toggleTheme()">
                    🌙 <span id="theme-label" data-i18n="themeDark">Escuro</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Seção Principal / Hero -->
    <main class="main-content">
        <section class="hero-section">
            <h1 data-i18n="title">Biblioteca de Pedagogia & Psicologia</h1>
            <p class="subtitle" data-i18n="subtitle">Explore obras essenciais, aprenda com resumos e escute o conteúdo com leitura em voz alta.</p>
            
            <!-- Barra de Pesquisa e Filtros -->
            <div class="search-bar-container">
                <input type="text" id="search-input" placeholder="Buscar por título ou autor..." data-i18n-placeholder="searchPlaceholder">
            </div>

            <!-- Filtros por Categoria -->
            <div class="categories">
                <button class="chip active" data-category="Pedagogia" onclick="selectCategory(this, 'Pedagogia')" data-i18n="catPedagogy">Pedagogia</button>
                <button class="chip" data-category="Psicologia" onclick="selectCategory(this, 'Psicologia')" data-i18n="catPsychology">Psicologia</button>
                <button class="chip" data-category="Psicopedagogia" onclick="selectCategory(this, 'Psicopedagogia')" data-i18n="catPsychopedagogy">Psicopedagogia</button>
            </div>
        </section>

        <!-- Grade de Exibição dos Livros -->
        <section class="books-section">
            <div id="books-grid" class="books-grid">
                <!-- Os cards dos livros serão inseridos dinamicamente pelo JavaScript -->
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="footer-container">
            <p data-i18n="footerText">© 2026 EduMind - Conhecimento Aberto e Acessível.</p>
            <div class="social-links">
                <a href="#" class="social-icon" aria-label="GitHub">

                    </svg>
                </a>
                <a href="#" class="social-icon" aria-label="LinkedIn">

                </a>
            </div>
        </div>
    </footer>

    <!-- Arquivo de Script Externa -->
    <script src="script.js"></script>
</body>
</html>
